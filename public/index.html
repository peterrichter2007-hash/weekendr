<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weekendr – AI Travel Curator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f8f8;
      --text: #000000;
      --text-light: #666666;
      --accent: #c9a84c;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ==================== Navigation ==================== */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 1.5rem 2rem;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: -0.02em;
    }

    .logo-accent {
      color: var(--accent);
      font-style: italic;
    }

    nav .nav-center {
      display: flex;
      gap: 3rem;
      align-items: center;
    }

    nav a {
      font-size: 0.9rem;
      color: var(--text-light);
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--accent);
    }

    .hamburger {
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      background: none;
      border: none;
    }

    .hamburger span {
      width: 100%;
      height: 2px;
      background: var(--text);
      transition: all 0.3s;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -6px);
    }

    /* Menu Dropdown */
    .menu-dropdown {
      position: absolute;
      top: 60px;
      right: 2rem;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1rem 0;
      min-width: 200px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      display: none;
      flex-direction: column;
    }

    .menu-dropdown.show {
      display: flex;
    }

    .menu-dropdown a {
      padding: 0.8rem 1.5rem;
      font-size: 0.9rem;
      color: var(--text);
      transition: all 0.2s;
    }

    .menu-dropdown a:hover {
      background: rgba(201, 168, 76, 0.1);
      padding-left: 2rem;
    }

    /* ==================== Hero Section ==================== */
    #hero {
      padding-top: 80px;
      padding-bottom: 60px;
      min-height: 90vh;
      display: flex;
      align-items: center;
    }

    .hero-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .hero-content h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .hero-subtext {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Image Carousel */
    .hero-carousel {
      position: relative;
      height: 500px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .carousel-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: fadeInOut 10s infinite;
    }

    .carousel-image:nth-child(2) {
      animation-delay: 10s;
    }

    .carousel-image:nth-child(3) {
      animation-delay: 20s;
    }

    @keyframes fadeInOut {
      0%, 32% { opacity: 1; }
      33%, 99% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ==================== Search Form ==================== */
    .search-form {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 2.5rem;
      border-radius: 16px;
      margin-top: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .form-group input,
    .form-group select {
      padding: 0.8rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.5);
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    /* Mood Pills */
    .mood-section {
      margin-bottom: 1.5rem;
    }

    .mood-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.8rem;
      display: block;
    }

    .mood-pills {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .mood-pill {
      padding: 0.6rem 1rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .mood-pill:hover {
      border-color: var(--accent);
      background: rgba(201, 168, 76, 0.05);
    }

    .mood-pill.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-generate {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.5rem;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(201, 168, 76, 0.2);
    }

    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ==================== Results Section ==================== */
    .results-container {
      display: none;
      padding: 4rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .results-container.show {
      display: block;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    /* Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    .glass-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      border-color: var(--accent);
    }

    .card-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 2rem;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .card-country {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 1rem;
    }

    .card-summary {
      font-size: 0.95rem;
      color: var(--text-light);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .card-highlights {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .card-highlight {
      color: var(--text);
    }

    .card-highlight::before {
      content: "✓ ";
      color: var(--accent);
      font-weight: 700;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .card-budget {
      font-weight: 700;
      color: var(--accent);
    }

    .card-mood {
      font-size: 0.8rem;
      background: rgba(201, 168, 76, 0.1);
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
    }

    .btn-view {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.3s;
    }

    .btn-view:hover {
      background: #b39340;
    }

    /* ==================== Detail Page ==================== */
    #detail-page {
      display: none;
      padding-top: 80px;
    }

    #detail-page.show {
      display: block;
    }

    .detail-hero {
      width: 100%;
      height: 500px;
      object-fit: cover;
      display: block;
    }

    .detail-header {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
      text-align: center;
    }

    .detail-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .detail-subtitle {
      font-size: 1.1rem;
      color: var(--text-light);
    }

    .detail-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      margin-bottom: 3rem;
    }

    .itinerary {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 2rem;
    }

    .day {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .day:last-child {
      border-bottom: none;
    }

    .day-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .activity {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
      border-left: 2px solid rgba(201, 168, 76, 0.3);
    }

    .activity-time {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.85rem;
    }

    .activity-title {
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .activity-desc {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .info-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .info-title {
      font-weight: 700;
      margin-bottom: 0.8rem;
      color: var(--accent);
    }

    .info-item {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    /* Map & Weather */
    #map {
      width: 100%;
      height: 400px;
      border-radius: 16px;
      margin-bottom: 2rem;
    }

    .weather-widget {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
    }

    .weather-temp {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .weather-desc {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    /* CTA Buttons */
    .cta-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-cta {
      padding: 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-cta:hover {
      background: #b39340;
      transform: translateY(-2px);
    }

    /* ==================== Error & Loading ==================== */
    .error-message {
      background: #fde2e4;
      color: #9b2c2c;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading-spinner {
      display: inline-flex;
      gap: 0.4rem;
    }

    .dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.4s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-close {
      float: right;
      font-size: 2rem;
      cursor: pointer;
      color: var(--text-light);
    }

    .modal-close:hover {
      color: var(--text);
    }

    /* ==================== Responsive ==================== */
    @media (max-width: 1024px) {
      .hero-container {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .cta-buttons {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      nav {
        padding: 1rem;
      }

      nav .nav-center {
        display: none;
      }

      .hero-container {
        padding: 0 1rem;
      }

      .search-form {
        padding: 1.5rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .mood-pills {
        gap: 0.4rem;
      }

      .results-grid {
        grid-template-columns: 1fr;
      }

      .detail-title {
        font-size: 2rem;
      }

      .detail-grid {
        gap: 1.5rem;
      }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="logo">week<span class="logo-accent">endr</span></div>
  <div class="nav-center">
    <a href="#hero">Home</a>
    <a href="#results" onclick="scrollToResults()">Trips</a>
  </div>
  <button class="hamburger" id="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="menu-dropdown" id="menu-dropdown">
    <a href="#" onclick="resetApp(); return false;">New Search</a>
    <a href="#" onclick="resetApiKey(); return false;">Change API Key</a>
    <a href="#" onclick="showAbout(); return false;">About</a>
  </div>
</nav>

<!-- Hero Section -->
<section id="hero">
  <div class="hero-container">
    <div class="hero-content">
      <h1>Discover Your<br>Perfect Weekend</h1>
      <p class="hero-subtext">Let AI curate 3 extraordinary trips based on your mood, budget & style. All planned down to the minute.</p>

      <div class="search-form">
        <div class="form-grid">
          <div class="form-group">
            <label>From</label>
            <input type="text" id="from" placeholder="Your city" autocomplete="off">
          </div>
          <div class="form-group">
            <label>To (Optional)</label>
            <input type="text" id="to" placeholder="Or let AI choose">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="date">
          </div>
          <div class="form-group">
            <label>Budget</label>
            <select id="budget">
              <option value="">Select...</option>
              <option value="budget">$100-200</option>
              <option value="mid">$200-400</option>
              <option value="comfort">$400-600</option>
              <option value="premium">$600+</option>
            </select>
          </div>
        </div>

        <div class="mood-section">
          <label class="mood-label">Vibe</label>
          <div class="mood-pills">
            <button class="mood-pill" data-mood="party">🎉 Party</button>
            <button class="mood-pill" data-mood="food">🍽️ Food</button>
            <button class="mood-pill" data-mood="relax">🌊 Relax</button>
            <button class="mood-pill" data-mood="culture">🏛️ Culture</button>
            <button class="mood-pill" data-mood="adventure">🏔️ Adventure</button>
          </div>
        </div>

        <button class="btn-generate" onclick="generateTrips()">Generate Trips</button>
      </div>
    </div>

    <div class="hero-carousel">
      <img class="carousel-image" src="https://images.pexels.com/photos/3915857/pexels-photo-3915857.jpeg?auto=compress&cs=tinysrgb&w=800" alt="">
      <img class="carousel-image" src="https://images.pexels.com/photos/3889857/pexels-photo-3889857.jpeg?auto=compress&cs=tinysrgb&w=800" alt="">
      <img class="carousel-image" src="https://images.pexels.com/photos/2398220/pexels-photo-2398220.jpeg?auto=compress&cs=tinysrgb&w=800" alt="">
    </div>
  </div>
</section>

<!-- Results Section -->
<section id="results" class="results-container">
  <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300;">Your Curated Trips</h2>
  <div class="error-message" id="error"></div>
  <div class="results-grid" id="results-grid"></div>
</section>

<!-- Detail Page -->
<section id="detail-page">
  <img id="detail-hero-img" class="detail-hero" src="" alt="">
  <div class="detail-header">
    <h1 id="detail-title" class="detail-title"></h1>
    <p id="detail-subtitle" class="detail-subtitle"></p>
  </div>

  <div class="detail-content">
    <div class="detail-grid">
      <div class="itinerary" id="itinerary"></div>
      <div class="sidebar">
        <div class="info-card">
          <div class="info-title">Budget</div>
          <div class="info-item" id="detail-budget"></div>
        </div>
        <div class="info-card">
          <div class="info-title">Weather</div>
          <div id="weather-widget" class="weather-widget"></div>
        </div>
      </div>
    </div>

    <div id="map" style="display: none;"></div>

    <div class="cta-buttons">
      <button class="btn-cta" onclick="bookFlight()">✈️ Flights</button>
      <button class="btn-cta" onclick="bookHotel()">🏨 Hotels</button>
      <button class="btn-cta" onclick="bookActivities()">🎫 Activities</button>
    </div>
  </div>
</section>

<!-- API Key Modal -->
<div id="api-modal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeApiModal()">&times;</span>
    <h2>API Key Required</h2>
    <p style="margin: 1rem 0; color: var(--text-light);">Get your Claude API key from <a href="https://console.anthropic.com" target="_blank" style="color: var(--accent); text-decoration: underline;">console.anthropic.com</a></p>
    <input type="password" id="api-key" placeholder="sk-ant-..." style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem;">
    <button onclick="saveApiKey()" style="width: 100%; padding: 0.8rem; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Save & Generate</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  let selectedMoods = [];
  let apiKey = localStorage.getItem('weekendr_key');
  let currentTrip = null;

  // Set default date
  document.getElementById('date').valueAsDate = getNextFriday();

  // Mood pills
  document.querySelectorAll('.mood-pill').forEach(pill => {
    pill.addEventListener('click', function(e) {
      e.preventDefault();
      this.classList.toggle('active');
      updateMoods();
    });
  });

  function updateMoods() {
    selectedMoods = Array.from(document.querySelectorAll('.mood-pill.active')).map(p => p.dataset.mood);
  }

  function getNextFriday() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const daysUntilFriday = (5 - dayOfWeek + 7) % 7;
    const friday = new Date(today);
    friday.setDate(friday.getDate() + daysUntilFriday + (daysUntilFriday === 0 ? 7 : 0));
    return friday;
  }

  // Menu toggle
  function toggleMenu() {
    document.getElementById('hamburger').classList.toggle('active');
    document.getElementById('menu-dropdown').classList.toggle('show');
  }

  // Generate trips
  function generateTrips() {
    const from = document.getElementById('from').value.trim();
    const to = document.getElementById('to').value.trim();
    const date = document.getElementById('date').value;
    const budget = document.getElementById('budget').value;

    if (!from || !date || !budget) {
      showError('Please fill in all required fields');
      return;
    }

    if (!apiKey) {
      document.getElementById('api-modal').classList.add('show');
      return;
    }

    const prompt = `You are a luxury travel curator. Create 3 DISTINCT weekend trips based on these inputs:
From: ${from}
To: ${to || 'Choose best destination'}
Date: ${date}
Budget: ${budget}
Mood: ${selectedMoods.join(', ') || 'Balanced'}

Return ONLY a valid JSON array (no markdown) with exactly 3 trip objects. Each object must have:
{
  "city": "City Name",
  "country": "Country",
  "tagline": "One-line description",
  "summary": "2-3 sentences about why this trip",
  "highlights": ["Highlight 1", "Highlight 2", "Highlight 3"],
  "budget": "Price range (e.g. $150-250)",
  "mood": "Dominant mood tag",
  "image": "High-quality travel photo URL from pexels.com",
  "friday": [{"time": "HH:MM", "title": "Activity", "description": "Details"}],
  "saturday": [{"time": "HH:MM", "title": "Activity", "description": "Details"}],
  "sunday": [{"time": "HH:MM", "title": "Activity", "description": "Details"}],
  "weather": "23°C, Sunny",
  "hotel": "Hotel Name, €80/night"
}

Make them diverse, realistic, and inspiring. Only return the JSON array.`;

    const btn = document.querySelector('.btn-generate');
    btn.disabled = true;
    btn.innerHTML = '<div class="loading-spinner"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

    fetch('/api/generate-trips', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt, apiKey })
    })
    .then(r => r.ok ? r.json() : r.json().then(e => { throw new Error(e.error); }))
    .then(data => {
      let json = data.content[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const trips = JSON.parse(json);
      displayTrips(trips);
      document.getElementById('results').classList.add('show');
      scrollToResults();
    })
    .catch(err => {
      showError('Error: ' + err.message);
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = 'Generate Trips';
    });
  }

  function displayTrips(trips) {
    const grid = document.getElementById('results-grid');
    grid.innerHTML = trips.map((trip, i) => `
      <div class="glass-card" onclick="showDetail(${i})">
        <img src="${trip.image}" class="card-image" alt="${trip.city}">
        <div class="card-content">
          <div class="card-title">${trip.city}</div>
          <div class="card-country">${trip.country}</div>
          <p class="card-summary">${trip.summary}</p>
          <div class="card-highlights">
            ${trip.highlights.slice(0, 2).map(h => `<div class="card-highlight">${h}</div>`).join('')}
          </div>
          <div class="card-meta">
            <div class="card-budget">${trip.budget}</div>
            <div class="card-mood">${trip.mood}</div>
          </div>
          <button class="btn-view">View Trip →</button>
        </div>
      </div>
    `).join('');
    window.lastTrips = trips;
  }

  function showDetail(index) {
    const trip = window.lastTrips[index];
    currentTrip = trip;

    document.getElementById('detail-hero-img').src = trip.image;
    document.getElementById('detail-title').textContent = trip.city;
    document.getElementById('detail-subtitle').textContent = trip.country + ' • ' + trip.mood;
    document.getElementById('detail-budget').textContent = trip.budget;

    const itinerary = document.getElementById('itinerary');
    itinerary.innerHTML = `
      <div class="day">
        <div class="day-title">Friday</div>
        ${trip.friday.map(a => `
          <div class="activity">
            <div class="activity-time">${a.time}</div>
            <div class="activity-title">${a.title}</div>
            <div class="activity-desc">${a.description}</div>
          </div>
        `).join('')}
      </div>
      <div class="day">
        <div class="day-title">Saturday</div>
        ${trip.saturday.map(a => `
          <div class="activity">
            <div class="activity-time">${a.time}</div>
            <div class="activity-title">${a.title}</div>
            <div class="activity-desc">${a.description}</div>
          </div>
        `).join('')}
      </div>
      <div class="day">
        <div class="day-title">Sunday</div>
        ${trip.sunday.map(a => `
          <div class="activity">
            <div class="activity-time">${a.time}</div>
            <div class="activity-title">${a.title}</div>
            <div class="activity-desc">${a.description}</div>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('weather-widget').innerHTML = `
      <div class="weather-temp">${trip.weather.split(',')[0]}</div>
      <div class="weather-desc">${trip.weather.split(',')[1] || 'Weather'}</div>
    `;

    document.getElementById('detail-page').classList.add('show');
    document.getElementById('hero').style.display = 'none';
    document.getElementById('results').style.display = 'none';
    window.scrollTo(0, 0);
  }

  function scrollToResults() {
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
  }

  function bookFlight() {
    window.open(`https://www.skyscanner.com/transport/flights/${currentTrip.city}/`, '_blank');
  }

  function bookHotel() {
    window.open(`https://www.booking.com/searchresults.html?ss=${currentTrip.city}`, '_blank');
  }

  function bookActivities() {
    window.open(`https://www.getyourguide.com/s/?q=${currentTrip.city}`, '_blank');
  }

  function resetApp() {
    location.reload();
  }

  function resetApiKey() {
    localStorage.removeItem('weekendr_key');
    apiKey = null;
    document.getElementById('api-modal').classList.add('show');
  }

  function saveApiKey() {
    const key = document.getElementById('api-key').value.trim();
    if (!key.startsWith('sk-ant-')) {
      alert('Invalid API Key format');
      return;
    }
    apiKey = key;
    localStorage.setItem('weekendr_key', key);
    document.getElementById('api-modal').classList.remove('show');
    generateTrips();
  }

  function closeApiModal() {
    document.getElementById('api-modal').classList.remove('show');
  }

  function showError(msg) {
    const err = document.getElementById('error');
    err.textContent = msg;
    err.classList.add('show');
    setTimeout(() => err.classList.remove('show'), 5000);
  }

  function showAbout() {
    alert('weekendr - AI Travel Curator\nDesigned to inspire your perfect weekend.');
  }

  // Show API modal on load if no key
  if (!apiKey) {
    setTimeout(() => document.getElementById('api-modal').classList.add('show'), 2000);
  }
</script>

</body>
</html>
