<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weekendr – Luxury AI Travel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #0f1419;
      --bg-tertiary: #1a1f2e;
      --text-primary: #ffffff;
      --text-secondary: #b8b8b8;
      --accent: #d4af37;
      --accent-light: #e8c547;
      --glass-bg: rgba(30, 35, 50, 0.4);
      --glass-border: rgba(255, 255, 255, 0.08);
      --success: #4ade80;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #0d1117 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ==================== NAVIGATION ==================== */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 1.2rem 2rem;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #d4af37, #e8c547);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hamburger {
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      background: none;
      border: none;
    }

    .hamburger span {
      width: 100%;
      height: 1.5px;
      background: var(--text-primary);
      transition: all 0.3s;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    #menu-dropdown {
      position: fixed;
      top: 60px;
      right: 0;
      background: rgba(15, 20, 25, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(212, 175, 55, 0.1);
      padding: 2rem;
      min-width: 250px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s;
      z-index: 999;
    }

    #menu-dropdown.show {
      max-height: 500px;
    }

    #menu-dropdown a {
      display: block;
      padding: 0.8rem 0;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.3s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    #menu-dropdown a:hover {
      color: var(--accent);
    }

    /* ==================== HERO SECTION ==================== */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: 80px;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      opacity: 0.3;
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
      padding: 0 2rem;
    }

    .hero-headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #b8b8b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subheadline {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      color: var(--text-secondary);
      margin-bottom: 3rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .search-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 1.8rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s;
    }

    .form-group input::placeholder {
      color: var(--text-secondary);
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }

    .mood-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .mood-pill {
      padding: 0.9rem 1.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .mood-pill:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .mood-pill.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-generate {
      width: 100%;
      padding: 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
    }

    .btn-generate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }

    .btn-generate:disabled {
      opacity: 0.7;
    }

    /* ==================== RESULTS SECTION ==================== */
    #results {
      padding: 6rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #results.show {
      opacity: 1;
    }

    .results-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      margin-bottom: 4rem;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2.5rem;
    }

    .glass-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      group-hover: all 0.4s;
    }

    .glass-card:hover {
      transform: translateY(-12px);
      border-color: rgba(212, 175, 55, 0.3);
      box-shadow: 0 30px 60px rgba(212, 175, 55, 0.15), 0 0 1px rgba(212, 175, 55, 0.5);
    }

    .card-image {
      width: 100%;
      height: 280px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .glass-card:hover .card-image {
      transform: scale(1.05);
    }

    .card-content {
      padding: 2rem;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .card-country {
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 1.2rem;
      font-weight: 500;
    }

    .card-summary {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .card-highlights {
      margin-bottom: 1.5rem;
    }

    .card-highlight {
      font-size: 0.85rem;
      color: var(--text-secondary);
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-budget {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card-mood {
      font-size: 0.85rem;
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent);
      padding: 0.4rem 1rem;
      border-radius: 20px;
    }

    .btn-view {
      width: 100%;
      padding: 0.9rem;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      color: var(--accent);
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-view:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--accent);
    }

    /* ==================== DETAIL PAGE ==================== */
    #detail-page {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #0d1117 100%);
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      overflow-y: auto;
    }

    #detail-page.show {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-hero {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }

    .detail-header {
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .detail-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      margin-bottom: 0.8rem;
      letter-spacing: -0.02em;
    }

    .detail-subtitle {
      font-size: 1.1rem;
      color: var(--accent);
    }

    .detail-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 3rem;
      margin-bottom: 3rem;
    }

    .itinerary {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .day {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 2rem;
    }

    .day-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .activity {
      margin-bottom: 1.8rem;
    }

    .activity:last-child {
      margin-bottom: 0;
    }

    .activity-time {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .activity-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0.5rem 0;
    }

    .activity-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .info-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .info-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
    }

    .info-item {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
    }

    .weather-widget {
      font-size: 1rem;
      color: var(--text-primary);
    }

    .weather-temp {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .weather-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 0.4rem;
    }

    .cta-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 3rem;
    }

    .btn-cta {
      flex: 1;
      padding: 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }

    /* ==================== DETAIL BACK BUTTON ==================== */
    .detail-back {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 20;
      width: 44px;
      height: 44px;
      background: rgba(30, 35, 50, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 1.5rem;
      transition: all 0.3s;
    }

    .detail-back:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: var(--accent);
    }

    /* ==================== MODAL ==================== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 2000;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 3rem;
      max-width: 500px;
      width: 90%;
      position: relative;
      animation: modalSlideIn 0.3s ease-out;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 2rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .modal-close:hover {
      color: var(--accent);
    }

    .modal-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .modal-content p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .modal-content input {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      font-family: 'Poppins', sans-serif;
    }

    .modal-content input::placeholder {
      color: var(--text-secondary);
    }

    .modal-content input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }

    /* ==================== ERROR MESSAGE ==================== */
    .error-message {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: white;
      padding: 1.2rem 2rem;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 2001;
      max-width: 90%;
    }

    .error-message.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==================== LOADING SPINNER ==================== */
    .loading-spinner {
      display: inline-flex;
      gap: 6px;
    }

    .loading-spinner .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #000;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loading-spinner .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-spinner .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 1024px) {
      .results-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        flex-direction: row;
      }

      .detail-hero {
        height: 300px;
      }
    }

    @media (max-width: 768px) {
      nav {
        padding: 1rem 1.5rem;
      }

      .search-panel {
        padding: 1.8rem;
      }

      .results-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .hero-headline {
        font-size: clamp(2rem, 6vw, 3.5rem);
      }

      .detail-title {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }

      .detail-content {
        padding: 2rem 1.5rem;
      }

      .detail-hero {
        height: 250px;
      }

      .cta-buttons {
        flex-direction: column;
      }

      .mood-pills {
        gap: 0.6rem;
      }

      .mood-pill {
        padding: 0.7rem 1rem;
        font-size: 0.85rem;
      }

      .card-content {
        padding: 1.5rem;
      }

      .modal-content {
        padding: 2rem;
      }

      #results {
        padding: 4rem 1.5rem;
      }

      #hero {
        padding-top: 60px;
      }
    }

    @media (max-width: 480px) {
      .hero-headline {
        font-size: clamp(1.6rem, 5vw, 2.5rem);
      }

      .form-group input,
      .form-group select {
        padding: 1rem;
      }

      .search-panel {
        padding: 1.5rem;
      }

      #menu-dropdown {
        min-width: 200px;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">weekendr</div>
  <button class="hamburger" id="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<div id="menu-dropdown">
  <a href="#" onclick="resetApp(); return false;">New Search</a>
  <a href="#" onclick="resetApiKey(); return false;">Change API Key</a>
  <a href="#" onclick="showAbout(); return false;">About</a>
</div>

<!-- HERO SECTION -->
<section id="hero">
  <div class="hero-background"></div>

  <div class="hero-content">
    <h1 class="hero-headline">Find Your Perfect Weekend</h1>
    <p class="hero-subheadline">AI-curated luxury escapes across Europe</p>

    <div class="search-panel">
      <div class="form-group">
        <label class="form-label">From</label>
        <input type="text" id="from" placeholder="Your city">
      </div>

      <div class="form-group">
        <label class="form-label">To</label>
        <input type="text" id="to" placeholder="Or let AI choose">
      </div>

      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label class="form-label">Budget</label>
        <select id="budget">
          <option value="">Select budget...</option>
          <option value="budget">€100-200</option>
          <option value="mid">€200-400</option>
          <option value="comfort">€400-600</option>
          <option value="premium">€600+</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Vibe</label>
        <div class="mood-pills">
          <button class="mood-pill" data-mood="party">🎉 Party</button>
          <button class="mood-pill" data-mood="food">🍽️ Food</button>
          <button class="mood-pill" data-mood="relax">🌊 Relax</button>
          <button class="mood-pill" data-mood="culture">🏛️ Culture</button>
          <button class="mood-pill" data-mood="adventure">🏔️ Adventure</button>
        </div>
      </div>

      <button class="btn-generate" onclick="generateTrips()">Generate Trips</button>
    </div>
  </div>
</section>

<!-- RESULTS SECTION -->
<section id="results">
  <h2 class="results-title">Your Curated Trips</h2>
  <div class="error-message" id="error"></div>
  <div class="results-grid" id="results-grid"></div>
</section>

<!-- DETAIL PAGE -->
<section id="detail-page">
  <div class="detail-back" onclick="goBack()">←</div>
  <img id="detail-hero-img" class="detail-hero" src="" alt="">

  <div class="detail-header">
    <h1 class="detail-title" id="detail-title"></h1>
    <p class="detail-subtitle" id="detail-subtitle"></p>
  </div>

  <div class="detail-content">
    <div class="detail-grid">
      <div class="itinerary" id="itinerary"></div>
      <div class="sidebar">
        <div class="info-card">
          <div class="info-title">Budget</div>
          <div class="info-item" id="detail-budget"></div>
        </div>
        <div class="info-card">
          <div class="info-title">Weather</div>
          <div id="weather-widget" class="weather-widget"></div>
        </div>
      </div>
    </div>

    <div class="cta-buttons">
      <button class="btn-cta" onclick="bookFlight()">✈️ Flights</button>
      <button class="btn-cta" onclick="bookHotel()">🏨 Hotels</button>
      <button class="btn-cta" onclick="bookActivities()">🎫 Activities</button>
    </div>
  </div>
</section>

<!-- API KEY MODAL -->
<div id="api-modal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeApiModal()">&times;</span>
    <h2>API Key Required</h2>
    <p>Get your Claude API key from <a href="https://console.anthropic.com" target="_blank" style="color: var(--accent); text-decoration: underline;">console.anthropic.com</a></p>
    <input type="password" id="api-key" placeholder="sk-ant-...">
    <button class="btn-generate" onclick="saveApiKey()">Save & Generate</button>
  </div>
</div>

<script>
  let selectedMoods = [];
  let apiKey = localStorage.getItem('weekendr_key');
  let currentTrip = null;

  document.getElementById('date').valueAsDate = getNextFriday();

  document.querySelectorAll('.mood-pill').forEach(pill => {
    pill.addEventListener('click', function(e) {
      e.preventDefault();
      this.classList.toggle('active');
      updateMoods();
    });
  });

  function updateMoods() {
    selectedMoods = Array.from(document.querySelectorAll('.mood-pill.active')).map(p => p.dataset.mood);
  }

  function getNextFriday() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const daysUntilFriday = (5 - dayOfWeek + 7) % 7;
    const friday = new Date(today);
    friday.setDate(friday.getDate() + daysUntilFriday + (daysUntilFriday === 0 ? 7 : 0));
    return friday;
  }

  function toggleMenu() {
    document.getElementById('hamburger').classList.toggle('active');
    document.getElementById('menu-dropdown').classList.toggle('show');
  }

  function generateTrips() {
    const from = document.getElementById('from').value.trim();
    const to = document.getElementById('to').value.trim();
    const date = document.getElementById('date').value;
    const budget = document.getElementById('budget').value;

    if (!from || !date || !budget) {
      showError('Please fill in all required fields');
      return;
    }

    if (!apiKey) {
      document.getElementById('api-modal').classList.add('show');
      return;
    }

    const prompt = `You are a luxury travel curator. Create 3 DISTINCT weekend trips based on these inputs:
From: ${from}
To: ${to || 'Choose best destination'}
Date: ${date}
Budget: ${budget}
Mood: ${selectedMoods.join(', ') || 'Balanced'}

Return ONLY a valid JSON array (no markdown) with exactly 3 trip objects. Each object must have:
{
  "city": "City Name",
  "country": "Country",
  "tagline": "One-line description",
  "summary": "2-3 sentences about why this trip",
  "highlights": ["Highlight 1", "Highlight 2", "Highlight 3"],
  "budget": "Price range (e.g. €150-250)",
  "mood": "Dominant mood tag",
  "image": "High-quality travel photo URL from pexels.com",
  "friday": [{"time": "HH:MM", "title": "Activity", "description": "Details"}],
  "saturday": [{"time": "HH:MM", "title": "Activity", "description": "Details"}],
  "sunday": [{"time": "HH:MM", "title": "Activity", "description": "Details"}],
  "weather": "23°C, Sunny",
  "hotel": "Hotel Name, €80/night"
}

Make them diverse, realistic, and inspiring. Only return the JSON array.`;

    const btn = document.querySelector('.btn-generate');
    btn.disabled = true;
    btn.innerHTML = '<div class="loading-spinner"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

    fetch('/api/generate-trips', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt, apiKey })
    })
    .then(r => r.ok ? r.json() : r.json().then(e => { throw new Error(e.error); }))
    .then(data => {
      let json = data.content[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const trips = JSON.parse(json);
      displayTrips(trips);
      document.getElementById('results').classList.add('show');
      scrollToResults();
    })
    .catch(err => {
      showError('Error: ' + err.message);
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = 'Generate Trips';
    });
  }

  function displayTrips(trips) {
    const grid = document.getElementById('results-grid');
    grid.innerHTML = trips.map((trip, i) => `
      <div class="glass-card" onclick="showDetail(${i})">
        <img src="${trip.image}" class="card-image" alt="${trip.city}">
        <div class="card-content">
          <div class="card-title">${trip.city}</div>
          <div class="card-country">${trip.country}</div>
          <p class="card-summary">${trip.summary}</p>
          <div class="card-highlights">
            ${trip.highlights.slice(0, 2).map(h => `<div class="card-highlight">${h}</div>`).join('')}
          </div>
          <div class="card-meta">
            <div class="card-budget">${trip.budget}</div>
            <div class="card-mood">${trip.mood}</div>
          </div>
          <button class="btn-view">View Trip →</button>
        </div>
      </div>
    `).join('');
    window.lastTrips = trips;
  }

  function showDetail(index) {
    const trip = window.lastTrips[index];
    currentTrip = trip;

    document.getElementById('detail-hero-img').src = trip.image;
    document.getElementById('detail-title').textContent = trip.city;
    document.getElementById('detail-subtitle').textContent = trip.country + ' • ' + trip.mood;
    document.getElementById('detail-budget').textContent = trip.budget;

    const itinerary = document.getElementById('itinerary');
    itinerary.innerHTML = `
      <div class="day">
        <div class="day-title">Friday</div>
        ${trip.friday.map(a => `
          <div class="activity">
            <div class="activity-time">${a.time}</div>
            <div class="activity-title">${a.title}</div>
            <div class="activity-desc">${a.description}</div>
          </div>
        `).join('')}
      </div>
      <div class="day">
        <div class="day-title">Saturday</div>
        ${trip.saturday.map(a => `
          <div class="activity">
            <div class="activity-time">${a.time}</div>
            <div class="activity-title">${a.title}</div>
            <div class="activity-desc">${a.description}</div>
          </div>
        `).join('')}
      </div>
      <div class="day">
        <div class="day-title">Sunday</div>
        ${trip.sunday.map(a => `
          <div class="activity">
            <div class="activity-time">${a.time}</div>
            <div class="activity-title">${a.title}</div>
            <div class="activity-desc">${a.description}</div>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('weather-widget').innerHTML = `
      <div class="weather-temp">${trip.weather.split(',')[0]}</div>
      <div class="weather-desc">${trip.weather.split(',')[1] || 'Weather'}</div>
    `;

    document.getElementById('detail-page').classList.add('show');
    document.getElementById('hero').style.display = 'none';
    document.getElementById('results').style.display = 'none';
    window.scrollTo(0, 0);
  }

  function goBack() {
    document.getElementById('detail-page').classList.remove('show');
    document.getElementById('hero').style.display = 'flex';
    document.getElementById('results').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function scrollToResults() {
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
  }

  function bookFlight() {
    window.open(`https://www.skyscanner.com/transport/flights/${currentTrip.city}/`, '_blank');
  }

  function bookHotel() {
    window.open(`https://www.booking.com/searchresults.html?ss=${currentTrip.city}`, '_blank');
  }

  function bookActivities() {
    window.open(`https://www.getyourguide.com/s/?q=${currentTrip.city}`, '_blank');
  }

  function resetApp() {
    location.reload();
  }

  function resetApiKey() {
    localStorage.removeItem('weekendr_key');
    apiKey = null;
    document.getElementById('api-modal').classList.add('show');
  }

  function saveApiKey() {
    const key = document.getElementById('api-key').value.trim();
    if (!key.startsWith('sk-ant-')) {
      alert('Invalid API Key format');
      return;
    }
    apiKey = key;
    localStorage.setItem('weekendr_key', key);
    document.getElementById('api-modal').classList.remove('show');
    generateTrips();
  }

  function closeApiModal() {
    document.getElementById('api-modal').classList.remove('show');
  }

  function showError(msg) {
    const err = document.getElementById('error');
    err.textContent = msg;
    err.classList.add('show');
    setTimeout(() => err.classList.remove('show'), 5000);
  }

  function showAbout() {
    alert('weekendr – Luxury AI Travel\nAI-curated weekend escapes across Europe.');
  }

  if (!apiKey) {
    setTimeout(() => document.getElementById('api-modal').classList.add('show'), 2000);
  }
</script>

</body>
</html>
